<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores 🌻</title>
  <link rel="stylesheet" href="assets/css/carta.css">
</head>

<body>
  <div class="bg-hearts" aria-hidden="true">
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
  </div>

  <div class="container">
    <p class="hint">Toca la carta para abrirla 🌻</p>
    <div class="envelope">
      <div class="envelope-inner">

        <div class="envelope-front">
          <div class="postage-stamp">
            <svg fill="currentColor" version="1.1" xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 300 300" xml:space="preserve">
              <path d="M253.98,257.652c0-8.568,8.568-17.748,17.136-18.361c-1.224-4.895-1.224-10.402-0.611-15.299 ..."></path>
            </svg>
          </div>
          <div class="address">
            <p><span>Para:</span> <span>Usted</span></p>
            <p><span>De:</span> <span>Anomimo</span></p>
          </div>
        </div>

        <div class="envelope-back">
          <div class="top-fold"></div>
          <div class="letter">
            <img src="https://img.freepik.com/vector-premium/pulgar-dedos-imprimir-marca-huella-dactilar-amor-corazon_53500-1839.jpg"
                 alt="love1" class="custom-image">

            <p>Para la chica mas Bonita 👑❤️ <span class="highlight"></span></p>

            <img src="assets/img/imagen-carta.png" alt="love2" class="custom-image2">
          </div>
        </div>

      </div>
    </div>
    <a id="goToFlowers" class="letter-button" href="jardin.html">Ver tus flores ->🌻</a>
  </div>

  <audio id="bg-music" loop>
    <source src="assets/audio/musica-carta.mp3" type="audio/mpeg">
    Tu navegador no soporta audio.
  </audio>
  <script src="assets/js/carta.js"></script>
</body>
</html>
